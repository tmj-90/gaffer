name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Real audit gate: audit-gate.sh fails on any HIGH/CRITICAL advisory NOT
      # documented in .github/audit-allowlist.txt. Accepted advisories are listed
      # + justified there; everything new fails the build.
      # The bare `pnpm audit` call above is display-only (human-readable table);
      # `|| true` is intentional — pnpm audit exits non-zero for ANY advisory,
      # including allowlisted ones, so omitting it would abort the step before
      # audit-gate.sh (the actual enforcement) runs. The gate is audit-gate.sh.
      # Lock the gate's exit-code contract (retired-endpoint→skip, HIGH→fail,
      # unknown→fail-closed, clean→ok) with a hermetic, network-free self-test so a
      # future edit can't silently turn the gate into a false all-clear.
      - name: Audit-gate self-test
        shell: bash
        run: bash .github/scripts/audit-gate.test.sh

      - name: Dependency audit
        shell: bash
        run: |
          echo "::group::pnpm audit (human-readable display)"
          pnpm audit --audit-level=high || true
          echo "::endgroup::"
          .github/scripts/audit-gate.sh

      - name: Verify better-sqlite3 native binding loads
        # Both packages depend on better-sqlite3 (now unified on ^12). Resolve the
        # native module from EACH package — pnpm does not hoist it to the workspace
        # root, so a root require() would fail, and a binding can build for one
        # package's install context but not another. Check both.
        shell: bash
        run: |
          for pkg in dispatch memory; do
            ( cd "packages/$pkg" && node -e "const D=require('better-sqlite3');const db=new D(':memory:');db.exec('create table t(x)');db.prepare('insert into t values (1)').run();if(db.prepare('select count(*) c from t').get().c!==1)throw new Error('better-sqlite3 binding check failed');db.close();console.log('$pkg: better-sqlite3 native binding OK')" )
          done

      - name: Lint
        run: pnpm lint

      # ~27k lines of production bash (the live delivery runtime) — static-check it like
      # the TypeScript. Error severity is the gate (parse errors, missing shell directive,
      # unquoted-glob-in-test classes); warnings are reported in the log for the baseline
      # burn-down but do not fail the job yet. `-x` follows `source` so factory.config.sh's
      # sourced libs are checked in context. LC_ALL=C.UTF-8: shellcheck 0.9 aborts on
      # non-ASCII comments under a POSIX locale.
      - name: Shellcheck (runner bash)
        if: runner.os == 'Linux'
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck --version | head -2
          FILES=(runner/tick.sh runner/loop.sh runner/worker.sh runner/factory.config.sh runner/gaffer
                 runner/setup.sh runner/preflight.sh runner/status.sh runner/run-summary.sh runner/demo.sh
                 runner/lib/*.sh runner/eval/*.sh runner/sandbox/smoke-test.sh runner/bin/poll-once.sh runner/test/*.sh
                 runner/test/lib/*.sh)
          echo "::group::warnings (informational baseline)"
          shellcheck -S warning -x "${FILES[@]}" || true
          echo "::endgroup::"
          shellcheck -S error -x "${FILES[@]}"

      - name: Format check
        run: pnpm format:check

      # Build first: cross-package imports (e.g. crew's tests import the `dispatch`
      # workspace package) resolve against each package's built dist/*.d.ts, so the
      # typecheck steps must run after the build.
      - name: Build
        run: pnpm -r build

      # docs/CONFIG.md is generated from factory.config.sh + SETTING_DEFS (needs the
      # dispatch build above). A knob added, renamed or re-defaulted without
      # regenerating the reference fails here.
      - name: Config reference is current
        run: node scripts/config-reference.mjs --check

      # docs/openapi.json is generated from the endpoint table + the zod schemas the
      # routes validate with (needs the dispatch build). A route added, renamed or
      # re-shaped without regenerating the contract fails here.
      - name: OpenAPI contract is current
        run: node scripts/openapi.mjs --check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Typecheck (tests)
        run: pnpm -r typecheck:test

      - name: Test (packages)
        run: pnpm -r test

      # Coverage gate: re-runs the suites with v8 coverage and enforces the
      # per-package floor (thresholds live in each packages/*/vitest.config.ts).
      # A drop below the floor fails the job. Runs after the plain test step so a
      # coverage-provider hiccup is distinguishable from a real test failure. The
      # floors are platform-independent, so ONE cell enforces them — the other three
      # would only re-run the same suites (70-100s each) for the same verdict.
      - name: Coverage (floor gate)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm -r test:coverage

      # Every runner test (runner/test/*.test.sh + *.test.mjs) through the shared
      # harness, runner/test/run.sh — the same command contributors run locally
      # (`pnpm test:runner`). It runs them in parallel (-j = CPU count) with each
      # test's output buffered into its own ::group::, a per-test wall-clock cap
      # (perl alarm — GNU `timeout` isn't on macOS: .sh 120s, .mjs 300s; the long
      # e2e tests are queued FIRST with a 600s cap), and exits non-zero on ANY failure.
      # The harness also: counts exit 77 / "SKIP…" lines as skips (listed in the step
      # summary, never as passes); under GAFFER_TEST_STRICT=1 fails every skip whose
      # reason is not a genuine platform gap (runner/test/lib/skip.sh allowlist —
      # this job builds every package, so "not built" is a failure here); puts a
      # `claude` tripwire on PATH so a test that would make a real model call fails;
      # and fails if a test wrote into the checkout's .gaffer/.dispatch/.crew dirs.
      - name: Runner tests
        shell: bash
        env:
          GAFFER_TEST_STRICT: "1"
          GAFFER_TEST_ARTIFACTS: ${{ runner.temp }}/gaffer-test-artifacts
        run: bash runner/test/run.sh

      # Forensics for a failing runner test that left evidence (e.g. the
      # concurrency-bookkeeping D3 snapshot: a consistent copy of its dispatch DB +
      # the per-delivery logs). Nothing is uploaded when a test saved nothing.
      - name: Upload runner-test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-test-evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/gaffer-test-artifacts
          if-no-files-found: ignore
          retention-days: 14

      # The idle maintenance lane END TO END through the real tick.sh: a fixture repo
      # with a planted god-file, tick 1 drafts the tech-debt finding with its
      # machine-checkable oracle and self-improve promotes it, tick 2 delivers it with
      # the stub worker and the runner verifies the oracle, tick 3 dedupes. Its own
      # step (three real ticks, ~15s) so the 120s per-test cap above never bites it.
      - name: Maintenance lane end to end (real runner, stub worker)
        shell: bash
        run: perl -e 'alarm shift; exec @ARGV' 400 bash runner/test/maintenance-e2e.sh

      # Golden gate fixtures: recorded deliveries replayed through the REAL gate
      # pipeline (hygiene · minimalism · Definition of Done · acceptance checks);
      # every verdict and the resulting submit/rework outcome must match the
      # fixture's expectation. A gate that starts passing a known-bad delivery, or
      # bouncing a known-good one, fails here. results.json is printed for the log.
      - name: Gate replay (golden fixtures)
        shell: bash
        run: |
          bash runner/eval/replay.sh --out "$RUNNER_TEMP/gate-replay"
          echo "::group::results.json"
          cat "$RUNNER_TEMP/gate-replay/results.json"
          echo "::endgroup::"

      # No test may touch the operator state a checkout's factory runs on. Every
      # suite above uses a private GAFFER_DATA / DISPATCH_DB / MEMORY_DB / crew event
      # log; anything left in these (gitignored, hence --ignored) paths means a test
      # fell back to the checkout's defaults — which on a contributor's machine are
      # their LIVE factory's DBs, audit log and settings.
      - name: Tests left no operator state in the checkout
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          left="$(git status --porcelain --ignored -- .gaffer .dispatch .crew runner/.crew runner/.dispatch 'packages/*/.crew' 'packages/*/.dispatch')"
          if [ -n "$left" ]; then
            echo "::error::tests wrote operator state into the checkout:"; printf '%s\n' "$left"; exit 1
          fi
          echo "clean: no .gaffer / .dispatch / .crew state in the checkout"

  # The dashboard in a REAL browser: onboard → ticket → machine-checkable AC → poll
  # (live tick with a stub worker) → review/approve → merge → product-owner run → every
  # view rendered with zero console errors, zero failed requests and zero critical /
  # serious WCAG 2.1 A/AA violations (axe-core). Its own job so a browser download or
  # rendering hiccup never reds the unit matrix, and ubuntu-only (one browser is enough).
  # playwright-core is pinned in scripts/ui-regression/run.sh; the Chromium installed
  # here MUST be the same version or playwright-core refuses to launch it.
  ui-regression:
    name: Dashboard browser regression (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Install Chromium (same version as the harness's playwright-core)
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      - name: Browser regression
        shell: bash
        env:
          UI_REGRESS_OUT: ${{ runner.temp }}/ui-regression
        run: |
          bash scripts/ui-regression/run.sh
          echo "::group::results.json"
          cat "$UI_REGRESS_OUT/shots/results.json" 2>/dev/null || true
          echo "::endgroup::"

  # Dedicated job for the Mode-2 docker containment gate. Kept OUT of the general bash
  # suite (which runs on every OS × node and would be fragile on shared runners) so a
  # docker-registry hiccup can't red the main matrix. Runs the red-team gate on a
  # docker-capable runner. On PULL REQUESTS the test SKIPS (green) on a registry /
  # rate-limit infra failure and only fails on a genuine containment regression; on a
  # PUSH TO MAIN a skip is a failure (GAFFER_SANDBOX_TEST_REQUIRE=1) so the gate can
  # never be silently green on the branch that ships.
  sandbox-containment:
    name: Docker sandbox containment gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Red-team containment gate (docker)
        env:
          RUN_SANDBOX_DOCKER_TEST: "1"
          # On a push to main the gate must have RUN: an infra skip (no daemon, registry
          # rate-limit, image build failure) is a red job, not a silent green. Pull requests
          # keep the tolerant posture so a Docker Hub hiccup can't block review.
          GAFFER_SANDBOX_TEST_REQUIRE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash runner/test/sandbox-docker-containment.test.sh
