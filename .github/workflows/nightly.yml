name: Nightly

# The cells that are too costly to run on every push, run once a day on main with
# the same strictness as ci.yml (GAFFER_TEST_STRICT=1, the same caps, the claude
# tripwire, the operator-state guard) and the same evidence upload on a failure.
#
#   runner / macOS node 24: 3 shards (runner-shard.yml), shard 1 with the package
#   tests. ci.yml runs the other three cells on every push; see the `runner` comment
#   there for why this one moved (the 5-concurrent-macOS limit queued it 755 s).
#   GAFFER_TEST_EXHAUSTIVE=1: tests with a cheap default form run their full form
#   (direct-run-isolation re-runs every listed test, not only the quick ones).
#
# A failed night is a red run on the Actions tab and on the Nightly badge in
# README.md, and GitHub mails it to whoever last changed the schedule; the failing
# shard's evidence is uploaded as runner-test-evidence-macos-latest-node24-shard<K>of3.
# Run it by hand from the Actions tab (workflow_dispatch), e.g. before a release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner:
    name: runner / ${{ matrix.os }} / node ${{ matrix.node }} / ${{ matrix.shard }} of ${{ matrix.shards }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # head_start ≈ the package tests' wall time (135 s on run 41338925244) × -j 3.
          - { os: macos-latest, node: "24", shard: 1, shards: 3, head_start: 400, packages: true }
          - { os: macos-latest, node: "24", shard: 2, shards: 3, head_start: 400 }
          - { os: macos-latest, node: "24", shard: 3, shards: 3, head_start: 400 }
    uses: ./.github/workflows/runner-shard.yml
    with:
      os: ${{ matrix.os }}
      node: ${{ matrix.node }}
      shard: ${{ matrix.shard }}
      shards: ${{ matrix.shards }}
      head_start: ${{ matrix.head_start }}
      packages: ${{ matrix.packages == true }}
      exhaustive: true
