# Release — tag vX.Y.Z → GitHub release with package tarballs, a CycloneDX SBOM,
# checksums and a build-provenance statement, plus the container image on GHCR
# with BuildKit's own SBOM + provenance attestations.
#
# Cut a release with scripts/version.mjs (see docs/RELEASING.md): it moves every
# package to one version and cuts the changelog; the tag must equal that version
# or the first step fails. Everything below is derived from the tagged commit —
# nothing is hand-uploaded.
#
# Two jobs (F5). `build` holds a READ-ONLY token: it installs, checks the tag, builds,
# runs the tests and packs the release assets, then hands them on as an artifact.
# `publish` holds contents: write + packages: write and runs no repository test code
# and no repository script: it downloads that artifact, verifies its SHA256SUMS, builds
# and pushes the image from the Dockerfile (inside BuildKit, which never sees the
# token) and creates the release from the downloaded files. So a test, a dependency
# install script or a build script never runs where the write token is reachable.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, pack (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag names the version everywhere (tarballs, SBOM, image label): refuse
      # a tag that does not match package.json rather than publish a mismatch.
      - name: Tag matches the package version
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME}"

      - name: Build
        run: pnpm -r build

      # The tagged commit is already CI-green on main; this is the release's own
      # proof that what is packed passes its tests.
      - name: Test
        run: pnpm -r test

      - name: Version + notes
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release
          node scripts/release-notes.mjs "$VERSION" > release/NOTES.md
          echo "::group::release notes"; cat release/NOTES.md; echo "::endgroup::"

      # One tarball per publishable package (exactly `npm pack` output: the `files`
      # allow-list of each package.json), named <name>-<version>.tgz.
      - name: Pack packages
        run: |
          for p in packages/*/; do
            pnpm -C "$p" pack --pack-destination "$PWD/release" >/dev/null
          done
          ls -la release

      - name: SBOM (CycloneDX)
        run: node scripts/sbom.mjs --timestamp --out "release/gaffer-${{ steps.meta.outputs.version }}.cdx.json"

      - name: Checksums + provenance statement
        run: |
          cd release
          sha256sum ./*.tgz ./*.cdx.json > SHA256SUMS
          cd ..
          node scripts/provenance.mjs --out "release/gaffer-${{ steps.meta.outputs.version }}.provenance.json" release/*.tgz release/*.cdx.json release/SHA256SUMS

      - name: Hand the assets to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish image + release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release + upload assets
      packages: write # push the image to GHCR
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The checkout is the image's build context only: no install, no script, no test
      # of the repository runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the assets the build job packed
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: release

      # The assets must be exactly what the build job checksummed.
      - name: Verify the checksums
        run: |
          case "$VERSION" in "" | *[!0-9A-Za-z.+-]*) echo "bad version from the build job: '$VERSION'"; exit 1 ;; esac
          cd release && sha256sum -c SHA256SUMS

      # Container image: plain buildx (no third-party action). --provenance/--sbom
      # make BuildKit attach its own signed-by-registry attestations to the image.
      - name: Log in to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + push image
        run: |
          docker buildx create --use --name gaffer-release >/dev/null
          IMAGE_LC="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker buildx build \
            --push \
            --provenance=mode=max --sbom=true \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "$IMAGE_LC:${VERSION}" \
            --tag "$IMAGE_LC:latest" \
            .
          echo "image=$IMAGE_LC:${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown in the release body
          {
            cat release/NOTES.md
            printf '\n---\n\n**Container image:** `%s:%s` (BuildKit SBOM + provenance attestations attached)\n' "$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')" "${VERSION}"
            printf '**Assets:** package tarballs (`npm pack` output), `SHA256SUMS`, a CycloneDX SBOM and an unsigned SLSA v1 provenance statement — see docs/RELEASING.md.\n'
          } > release/BODY.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "Gaffer ${GITHUB_REF_NAME}" \
            --notes-file release/BODY.md \
            --verify-tag \
            release/*.tgz release/*.cdx.json release/*.provenance.json release/SHA256SUMS
