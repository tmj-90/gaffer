<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7a1631" />
    <title>Gaffer</title>
    <link rel="icon" type="image/svg+xml" href="/gaffer-favicon.svg" />
    <!-- Per-viewer kit (light/dark) is applied before first paint; CSP allows 'self' scripts only. -->
    <script src="/theme.js"></script>
    <!-- Self-hosted OFL fonts: the primary display + text faces are preloaded. -->
    <link
      rel="preload"
      href="/assets/fonts/big-shoulders-display-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/sofia-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Layered sheets: tokens.css declares the order
         reset, tokens, base, layout, components, views, utilities. -->
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/shell.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/views/overview.css" />
    <link rel="stylesheet" href="/css/views/work.css" />
    <link rel="stylesheet" href="/css/views/review.css" />
    <link rel="stylesheet" href="/css/views/ticket.css" />
    <link rel="stylesheet" href="/css/views/epics.css" />
    <link rel="stylesheet" href="/css/views/map.css" />
    <link rel="stylesheet" href="/css/views/health.css" />
    <link rel="stylesheet" href="/css/views/specs.css" />
    <link rel="stylesheet" href="/css/views/memory.css" />
    <link rel="stylesheet" href="/css/views/settings.css" />
    <link rel="stylesheet" href="/css/views/create.css" />
    <link rel="stylesheet" href="/css/utilities.css" />
  </head>
  <body>
    <a href="#app" class="skip-link">Skip to content</a>
    <!-- One polite region for short announcements (view changed, board updated),
         so a 9s refresh never re-reads the whole view. -->
    <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="toast" class="toast" role="alert" aria-live="assertive" hidden></div>

    <div class="shell">
      <!-- The club header and the phone bottom nav are built by app.js, so the
           login gate can keep them hidden. -->
      <header id="appbar" class="appbar" hidden></header>
      <main id="app" class="app" tabindex="-1">
        <p class="loading">Loading…</p>
      </main>
      <nav id="bottomnav" class="bottomnav" aria-label="Primary" hidden></nav>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
