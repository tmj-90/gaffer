# Gaffer RESEARCH egress proxy (backlog 69). Never the delivery filter widened: its own
# image, network and rules. The research container sits on its own --internal docker
# network; this proxy is its only way out.
#
#   * HTTPS CONNECT to port 443 only (ConnectPort 443). Plain http requests are refused
#     by the first filter line (FilterURLs On: the filter sees the request URL, which for
#     plain http starts with http:// and for CONNECT is host:port).
#   * Default ALLOW, then the deny list in ./filter: IP literals in every spelling,
#     single-label hosts, internal suffixes, metadata names and wildcard DNS services.
#     The research agent may read any public site; it may not reach a machine or a
#     network that is not the public web by name.
#   * What this proxy cannot see: a public name that resolves to a private address
#     (it resolves the name itself and connects). SECURITY.md says so.

User tinyproxy
Group tinyproxy
Port 8888
Timeout 120
LogLevel Info
MaxClients 20

Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

FilterDefaultDeny No
Filter "/etc/tinyproxy/filter"
FilterURLs On
FilterExtended On
FilterCaseSensitive Off

ConnectPort 443

# No Via / X-Tinyproxy header naming the client.
DisableViaHeader Yes
